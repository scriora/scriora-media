name: CI - scriora-media

on:
  pull_request:
    branches: [main, develop]
    
  push:
    branches: [main]
    
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript / Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Biome / Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Tests / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/unit/ --coverage --passWithNoTests

  contract-tests:
    name: Tests / Contract
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/contract/ --passWithNoTests

  integration-tests:
    name: Tests / Integration (FFmpeg + Sharp)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg + libvips
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/integration/ --passWithNoTests
        env:
          FFMPEG_BINARY_PATH: /usr/bin/ffmpeg

  security-tests:
    name: Tests / Security (Decompression Bombs + Magic Bytes)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/security/ --passWithNoTests

  build:
    name: Build / Compile
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

  docker:
    name: Build / Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scriora-media:ci .


